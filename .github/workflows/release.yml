name: Release

# A merge to main releases the version in package.json, once: when its tag already exists
# the run stops after the first job. Run it by hand to build everything without publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (off = build the artifacts only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    name: Version and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hodor/core build
      - id: meta
        run: node scripts/release-meta.mjs
      - id: tag
        name: Already released?
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.meta.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.meta.outputs.tag }} is already released; bump the version to release again"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build (${{ matrix.name }})
    needs: meta
    if: needs.meta.outputs.exists == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Windows x64
            os: windows-latest
            args: --win
          - name: Linux x64
            os: ubuntu-latest
            args: --linux
          - name: Linux arm64
            os: ubuntu-24.04-arm
            args: --linux
            # electron-builder's own fpm is x64 only
            system-fpm: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          if [ "${{ matrix.system-fpm }}" = "true" ]; then
            sudo apt-get install -y ruby ruby-dev build-essential
            sudo gem install fpm --no-document
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @hodor/cli bundle
      - name: Package
        working-directory: packages/gui
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned for 1.0: don't let electron-builder pick up a certificate from the runner
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          USE_SYSTEM_FPM: ${{ matrix.system-fpm && 'true' || '' }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hodor-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/gui/dist/*.dmg
            packages/gui/dist/*.zip
            packages/gui/dist/*.exe
            packages/gui/dist/*.AppImage
            packages/gui/dist/*.deb
            packages/gui/dist/*.rpm
            packages/gui/dist/*.tar.gz

      # The app before it's wrapped in the installer: the signed Windows build starts from here
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Windows'
        with:
          name: win-unpacked
          path: packages/gui/dist/win-unpacked/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish ${{ needs.meta.outputs.tag }}
    needs: [meta, build]
    # Publishing by hand works from main only
    if: github.event_name == 'push' || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: hodor-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: artifacts/*

      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.title }}
          body_path: release-notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.prerelease != 'true' }}
          files: artifacts/*
          fail_on_unmatched_files: true

  # ── Signed Windows build ──────────────────────────────────────────────────────────────────────
  # Next to the unsigned files, on pushes to main only. The certificate lives on a self-hosted
  # runner, which never checks out or builds code: it signs files built here and hands them back.
  #   1. signing-check   is the signing runner online? If not, everything below is skipped
  #   2. sign-app        signs Hodor.exe and elevate.exe in the unpacked app        (self-hosted)
  #   3. package-signed  wraps the signed app in the installer and zip, unchanged    (GitHub)
  #   4. sign-installer  signs the installer, checks every signature                 (self-hosted)
  #   5. publish-signed  adds the -signed files, their checksums and attestations to the release

  signing-check:
    name: Signing runner online?
    needs: meta
    if: needs.meta.outputs.exists == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      online: ${{ steps.check.outputs.online }}
    steps:
      - id: check
        env:
          # Fine-grained token with Administration: read on this repository (listing runners needs it)
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          LABEL: ${{ vars.SIGNING_RUNNER_LABEL || 'codesign' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RUNNER_STATUS_TOKEN isn't set: no signed Windows build this time"
            echo "online=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(gh api "repos/${{ github.repository }}/actions/runners" --paginate \
            --jq ".runners[] | select(.status == \"online\") | select(any(.labels[]; .name == \"$LABEL\")) | .name" | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "online=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No online runner labelled '$LABEL': skipping the signed Windows build"
            echo "online=false" >> "$GITHUB_OUTPUT"
          fi

  sign-app:
    name: Sign the app (Windows)
    needs: [build, signing-check]
    if: needs.signing-check.outputs.online == 'true'
    runs-on: [self-hosted, "${{ vars.SIGNING_RUNNER_LABEL || 'codesign' }}"]
    environment: signing
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: win-unpacked
          path: win-unpacked
      - name: Sign
        shell: pwsh
        env:
          CODESIGN_CERT_SUBJECT: ${{ vars.CODESIGN_CERT_SUBJECT }}
          CODESIGN_TIMESTAMP_URL: ${{ vars.CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) { throw 'signtool.exe not found (Windows SDK)' }
          if (-not $env:CODESIGN_CERT_SUBJECT) { throw 'CODESIGN_CERT_SUBJECT is not set' }
          if (-not $env:CODESIGN_TIMESTAMP_URL) { throw 'CODESIGN_TIMESTAMP_URL is not set' }

          $files = @('win-unpacked\Hodor.exe', 'win-unpacked\resources\elevate.exe') | Where-Object { Test-Path $_ }
          if (-not ($files -contains 'win-unpacked\Hodor.exe')) { throw 'Hodor.exe is missing from the build' }
          & $signtool sign /n "$env:CODESIGN_CERT_SUBJECT" /fd sha256 /tr "$env:CODESIGN_TIMESTAMP_URL" /td sha256 /a $files
          if ($LASTEXITCODE) { throw "signtool sign failed ($LASTEXITCODE)" }
          & $signtool verify /pa /all $files
          if ($LASTEXITCODE) { throw "signtool verify failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: win-unpacked-signed
          path: win-unpacked/
          if-no-files-found: error
          retention-days: 1

  package-signed:
    name: Installer from the signed app
    needs: [meta, sign-app]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          name: win-unpacked-signed
          path: signed/win-unpacked
      # --prepackaged wraps the folder as it is: Hodor.exe keeps its signature
      - name: Package
        working-directory: packages/gui
        run: >-
          pnpm exec electron-builder --win nsis zip --x64 --publish never
          --prepackaged ../../signed/win-unpacked
          "-c.artifactName=${productName}-${version}-${os}-${arch}-signed.${ext}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-signed-app
          path: |
            packages/gui/dist/*-signed.exe
            packages/gui/dist/*-signed.zip
          if-no-files-found: error
          retention-days: 1

  sign-installer:
    name: Sign the installer (Windows)
    needs: package-signed
    runs-on: [self-hosted, "${{ vars.SIGNING_RUNNER_LABEL || 'codesign' }}"]
    environment: signing
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-signed-app
          path: out
      - name: Sign and check
        shell: pwsh
        env:
          CODESIGN_CERT_SUBJECT: ${{ vars.CODESIGN_CERT_SUBJECT }}
          CODESIGN_TIMESTAMP_URL: ${{ vars.CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) { throw 'signtool.exe not found (Windows SDK)' }

          $installer = Get-ChildItem out\*-signed.exe | Select-Object -First 1
          if (-not $installer) { throw 'No installer to sign' }
          & $signtool sign /n "$env:CODESIGN_CERT_SUBJECT" /fd sha256 /tr "$env:CODESIGN_TIMESTAMP_URL" /td sha256 /a $installer.FullName
          if ($LASTEXITCODE) { throw "signtool sign failed ($LASTEXITCODE)" }

          # The app inside the zip must still carry the signature from sign-app
          $zip = Get-ChildItem out\*-signed.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath zip-check -Force
          & $signtool verify /pa /all $installer.FullName zip-check\Hodor.exe
          if ($LASTEXITCODE) { throw "signtool verify failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-signed
          path: |
            out/*-signed.exe
            out/*-signed.zip
          if-no-files-found: error

  publish-signed:
    name: Add the signed Windows files to ${{ needs.meta.outputs.tag }}
    needs: [meta, release, sign-installer]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-signed
          path: signed
      - name: Checksums
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir signed
          (cd signed && sha256sum *-signed.exe *-signed.zip >> SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: signed/*
      - name: Upload
        run: |
          gh release upload "$TAG" signed/*-signed.exe signed/*-signed.zip signed/SHA256SUMS --clobber
          gh release view "$TAG" --json body --jq .body > notes.md
          cat >> notes.md <<'NOTE'

          ### Signed Windows build

          The `-signed` installer and zip are code-signed (Certum), so Windows names the publisher instead of "Unknown publisher". Prefer them to the unsigned ones; the unsigned files stay for anyone who verifies builds through the attestations.
          NOTE
          gh release edit "$TAG" --notes-file notes.md
