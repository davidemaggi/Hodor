name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  test:
    name: Build, test and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: CLI bundle runs
        run: |
          pnpm --filter @hodor/cli bundle
          node packages/cli/bundle/hodor.mjs --version
        shell: bash

      - name: E2E smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e e2e/smoke.spec.ts e2e/cli.spec.ts e2e/reorder.spec.ts e2e/settings.spec.ts e2e/export.spec.ts
      - name: E2E smoke
        if: runner.os != 'Linux'
        run: pnpm e2e e2e/smoke.spec.ts e2e/cli.spec.ts e2e/reorder.spec.ts e2e/settings.spec.ts e2e/export.spec.ts
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: packages/gui/test-results/
          retention-days: 7

  kubernetes:
    name: Kubernetes ${{ matrix.k8s }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s: '1.34'
            image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - k8s: '1.35'
            image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - k8s: '1.36'
            image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - k8s: '1.37'
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
          node_image: ${{ matrix.image }}
          cluster_name: hodor
          wait: 120s
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Core against the cluster
        run: pnpm --filter @hodor/core exec vitest run tests/integration
        env:
          HODOR_IT: '1'
      # kind wrote ~/.kube/config; the app runs with a throwaway HOME and gets a copy of it
      - name: App against the cluster
        run: HODOR_E2E_KUBECONFIG="$HOME/.kube/config" xvfb-run -a pnpm e2e e2e/cluster.spec.ts
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-k8s-${{ matrix.k8s }}
          path: packages/gui/test-results/
          retention-days: 7
